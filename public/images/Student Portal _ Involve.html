        /* splash screen */
        .zspinner {
            width: 40px;
            height: 40px;
            background-color: #ffffff;
            margin: calc(50% - 200px) auto 0 auto;
            border-radius: 100%;
            -webkit-animation: sk-scaleout 2.0s infinite ease-in-out;
            animation: sk-scaleout 2.0s infinite ease-in-out;
        }
        .zspinner-x2 {
            width: 80px;
            height: 80px;
            background-color: #ffffff;
            margin: calc(50% - 200px) auto 0 auto;
            border-radius: 100%;
            -webkit-animation: sk-scaleout 2.0s infinite ease-in-out;
            animation: sk-scaleout 2.0s infinite ease-in-out;
        }
        @-webkit-keyframes sk-scaleout {
            0% {
                -webkit-transform: scale(0)
            }
            100% {
                -webkit-transform: scale(1.0);
                opacity: 0;
            }
        }
        @keyframes sk-scaleout {
            0% {
                -webkit-transform: scale(0);
                transform: scale(0);
            }
            100% {
                -webkit-transform: scale(1.0);
                transform: scale(1.0);
                opacity: 0;
            }
        }
        .loading-text {
            color: rgba(255, 255, 255, 0.7);
            text-align: center;
            font-weight: 100;
            font-family: 'Open Sans', sans-serif;
            font-size: 20px;
            width: 100%;
            height: 50px;
            margin: 5% auto 0 auto;
        }
            .loading-text:after {
                content: "Warming Up";
            }
        @keyframes changeLetter {
            0% {
                content: "Warming Up";
                color: #fff;
            }
            20% {
                content: "Warming Up";
                color: #fff;
            }
            30% {
                color: #463344;
            }
            40% {
                content: "Involving Students";
                color: #fff;
            }
            50% {
                color: #463344;
            }
            60% {
                content: "Calculating Odds";
                color: #fff;
            }
            70% {
                color: #463344;
            }
            75% {
                content: "Aligning Planets";
                color: #fff;
            }
            80% {
                color: #463344;
            }
            85% {
                content: "Tasting Rainbows";
                color: #fff;
            }
            90% {
                color: #463344;
            }
            100% {
                content: "To be honest, just updating a few things..";
                color: #fff;
            }
        }
        .loading-text:after {
            animation: changeLetter 35s linear infinite;
        }
        #loadingsplash {
            background: #463344;
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            overflow: hidden;
            z-index: 999999999;
        }
        body.rebrand,
        body.rebrand .nav-bar {
            margin-top: 40px;
        }
        body:not(.rebrand) .rebrand {
            display: none;
        }
