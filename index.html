    <link rel="icon" type="image/png" href="/SHPE_Website/SHPE_logo.png" />

    <title>WashU SHPE — Society of Hispanic Professional Engineers</title>

      name="description"
      content="Washington University in St. Louis SHPE chapter. Empowering the Hispanic community in STEM."

    <!-- Libre Franklin — open-source Franklin Gothic revival -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      href="https://fonts.googleapis.com/css2?family=Libre+Franklin:ital,wght@0,100..900;1,100..900&display=swap"

    />

    <link rel="preconnect" href="https://admissions.washu.edu" />

    <!-- GitHub Pages SPA redirect receiver (pairs with public/404.html) -->
    <script>
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) { return s.replace(/~and~/g, "&"); });
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) +
              decoded[0] +
              (decoded[1] ? "?" + decoded[1] : "") +
              l.hash
          );
        }
      })(window.location);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
