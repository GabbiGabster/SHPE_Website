<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      GitHub Pages SPA redirect fix.

      GitHub Pages is a static host — it serves files from disk. When a user
      visits a deep link like /SHPE_Website/leadership directly (or hits
      refresh on any page other than /SHPE_Website/), GitHub Pages looks for
      a file at that path, finds nothing, and serves this 404.html.

      This script converts the URL back into a query-string redirect to
      index.html, which React Router then interprets correctly.

      Technique by Rafael Pedicini:
      https://github.com/rafgraph/spa-github-pages
    -->
    <script>
      // Number of path segments to keep.
      // For a repo deployed at /SHPE_Website/ this is 1.
      // For a user/org page deployed at / this is 0.
      var segmentCount = 1;

      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname
            .split("/")
            .slice(0, 1 + segmentCount)
            .join("/") +
          "/?p=/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(segmentCount)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search ? "&q=" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash
      );
    </script>
  </head>
  <body>
    <!-- Redirecting... -->
  </body>
</html>
